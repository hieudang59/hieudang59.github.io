<main class="page-shell">
  <header class="topbar">
    <a class="wordmark" href="../../">Field Notes<span>.</span></a>
    <nav class="topbar-actions" aria-label="Page controls">
      <a class="topbar-link" href="../../#writing">All writing</a>
      <label class="theme-toggle">
        <input class="theme-toggle-input" type="checkbox" aria-label="Dark theme">
        <span class="theme-toggle-track" aria-hidden="true"><span></span></span>
        <span class="theme-toggle-label">Dark</span>
      </label>
    </nav>
  </header>

  <article class="post-page">
    <a class="back-link" href="../../">← Back to all writing</a>
    <header class="post-header">
      <p class="eyebrow">{{category}} <span>·</span> <time datetime="{{dateIso}}">{{date}}</time></p>
      <h1>{{title}}</h1>
      <p class="post-deck">{{excerpt}}</p>
    </header>
    <div class="prose">
      {{content}}
    </div>
    <footer class="post-tags" aria-label="Topics">
      {{tags}}
    </footer>
  </article>

  <footer class="site-footer">
    <span>Made for thoughtful work.</span>
    <a href="../../">Back to the beginning ↑</a>
  </footer>
</main>
